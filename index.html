<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of repositories starred on GitHub.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Stargazers log</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">GitHub activity</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small, growing record of the repositories worth keeping close.</p>
      </header>

      <section class="repository-section" aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Starred repositories</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status">Loading repositories...</p>
        </div>
      </section>
    </main>
  </body>
</html>
